/* ===== Embedded-context detection (runs immediately, before charts/data

   class the stylesheet uses to trim some vertical padding, since the host
   page's embed container has a fixed height and every extra px of chrome
   costs visible content, and (b) tell the parent page how tall our content
   actually is, in case the embed widget listens for a resize message. ===== */
try {
  const inIframe = window.self !== window.top;
  if (inIframe) {
    document.documentElement.classList.add('is-embedded');

    function postHeight() {
      const h = document.documentElement.scrollHeight;
      try {
        window.parent.postMessage({ type: 'resize', height: h, source: 'unibexs-market-report' }, '*');
        window.parent.postMessage(h, '*'); // plain-number fallback for simpler listeners
      } catch (e) { /* cross-origin parent — nothing more we can do */ }
    }

    window.addEventListener('load', postHeight);
    window.addEventListener('resize', postHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(postHeight).observe(document.body);
    } else {
      setInterval(postHeight, 1000);
    }
    postHeight();
  }
} catch (e) { console.error('[embedded detection] failed:', e); }

/* ===== Mobile TOC dropdown toggle + mobile layout reflow =====
   On phones (<=680px) the search box relocates to a slot at the very top
   of the page (always visible, not buried inside the collapsed dropdown),
   and the TOC toggle+list relocate to a slot immediately above the
   Annual Overview section. Desktop/tablet keep the original sticky
   left-sidebar layout untouched — nodes are only moved, never cloned, so
   all existing listeners (search, scrollspy) keep working automatically. */
try {
  const tocToggle = document.getElementById('tocToggle');
  const sidebarNav = document.getElementById('sidebarNav');
  const searchBox = document.querySelector('.sidebar-search');
  const mobileSearchSlot = document.getElementById('mobileSearchSlot');
  const mobileTocSlot = document.getElementById('mobileTocSlot');

  tocToggle.addEventListener('click', () => {
    const isOpen = sidebarNav.classList.toggle('open');
    tocToggle.classList.toggle('open', isOpen);
    tocToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  // Close the dropdown after picking a section on mobile
  document.querySelectorAll('.toc-link').forEach(l => {
    l.addEventListener('click', () => {
      sidebarNav.classList.remove('open');
      tocToggle.classList.remove('open');
      tocToggle.setAttribute('aria-expanded', 'false');
    });
  });

  if (searchBox && mobileSearchSlot && mobileTocSlot) {
    // Record each node's original (desktop) position so it can be restored exactly.
    const searchHome = { parent: searchBox.parentNode, next: searchBox.nextSibling };
    const toggleHome = { parent: tocToggle.parentNode, next: tocToggle.nextSibling };
    const sidebarHome = { parent: sidebarNav.parentNode, next: sidebarNav.nextSibling };

    function layoutMobile() {
      mobileSearchSlot.appendChild(searchBox);
      mobileTocSlot.appendChild(tocToggle);
      mobileTocSlot.appendChild(sidebarNav);
    }
    function layoutDesktop() {
      searchHome.parent.insertBefore(searchBox, searchHome.next);
      toggleHome.parent.insertBefore(tocToggle, toggleHome.next);
      sidebarHome.parent.insertBefore(sidebarNav, sidebarHome.next);
    }
    const mq = window.matchMedia('(max-width: 1199px)');
    const applyLayout = (e) => { if (e.matches) layoutMobile(); else layoutDesktop(); };
    applyLayout(mq);
    mq.addEventListener('change', applyLayout);
  }
} catch (e) { console.error('[mobile toc toggle] failed:', e); }

/* ===== Table scroll affordance (mobile) — fades the right edge of any
   horizontally-scrollable table until the user has scrolled to the end ===== */

    function update() {
      const atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 2;
      wrap.classList.toggle('scrolled-end', atEnd || wrap.scrollWidth <= wrap.clientWidth);
    }
    wrap.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
} catch (e) { console.error('[table scroll affordance] failed:', e); }

/* ===== Horizontal card sliders (Market Intel + Data Sources) — arrow
   buttons scroll the track by one card width, and edge fade masks show/hide
   based on scroll position, mirroring the table-scroll affordance above. ===== */
try {
  document.querySelectorAll('[data-slider]').forEach(wrap => {
    const track = wrap.querySelector('.slider-track');
    const prevBtn = wrap.querySelector('.slider-arrow.prev');
    const nextBtn = wrap.querySelector('.slider-arrow.next');
    if (!track) return;

    function cardStep() {
      const firstCard = track.firstElementChild;
      if (!firstCard) return track.clientWidth;
      const style = window.getComputedStyle(track);
      const gap = parseFloat(style.columnGap || style.gap || '0') || 0;
      return firstCard.getBoundingClientRect().width + gap;
    }

    function updateEdges() {
      const noOverflow = track.scrollWidth <= track.clientWidth + 1;
      const atStart = track.scrollLeft <= 2;
      const atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      wrap.classList.toggle('scrolled-start', atStart);
      wrap.classList.toggle('scrolled-end', atEnd || noOverflow);
      if (prevBtn) prevBtn.disabled = atStart || noOverflow;
      if (nextBtn) nextBtn.disabled = atEnd || noOverflow;
    }

    if (prevBtn) prevBtn.addEventListener('click', () => track.scrollBy({ left: -cardStep(), behavior: 'smooth' }));
    if (nextBtn) nextBtn.addEventListener('click', () => track.scrollBy({ left: cardStep(), behavior: 'smooth' }));
    track.addEventListener('scroll', updateEdges, { passive: true });
    window.addEventListener('resize', updateEdges);
    updateEdges();
  });
} catch (e) { console.error('[card sliders] failed:', e); }

/* ===== Real in-page content search (searches report text, not just section
   titles) — filters the TOC list AND highlights/jumps to matches in the
   actual page content. ===== */
try {
  const tocSearch = document.getElementById('tocSearch');
  const tocLinksForSearch = document.querySelectorAll('.toc-link');
  const mainEl = document.querySelector('main');
  let lastMarks = [];
  let lastMatchIndex = -1;

  function clearHighlights() {
    lastMarks.forEach(mark => {
      const parent = mark.parentNode;
      if (!parent) return;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    });
    lastMarks = [];
    lastMatchIndex = -1;
  }

  function highlightMatches(query) {
    clearHighlights();
    if (!query || query.length < 2) return;
    const q = query.toLowerCase();
    const walker = document.createTreeWalker(mainEl, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.toLowerCase().includes(q)) return NodeFilter.FILTER_REJECT;
        const tag = node.parentNode && node.parentNode.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const textNodes = [];
    let n;
    while ((n = walker.nextNode())) textNodes.push(n);

    textNodes.forEach(node => {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      const frag = document.createDocumentFragment();
      let cursor = 0;
      let idx = lower.indexOf(q);
      if (idx === -1) return;
      while (idx !== -1) {
        frag.appendChild(document.createTextNode(text.slice(cursor, idx)));
        const mark = document.createElement('mark');
        mark.className = 'search-hit';
        mark.textContent = text.slice(idx, idx + q.length);
        frag.appendChild(mark);
        lastMarks.push(mark);
        cursor = idx + q.length;
        idx = lower.indexOf(q, cursor);
      }
      frag.appendChild(document.createTextNode(text.slice(cursor)));
      node.parentNode.replaceChild(frag, node);
    });

    if (lastMarks.length) {
      lastMatchIndex = 0;
      lastMarks[0].classList.add('search-hit-active');
      lastMarks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  let searchDebounce;
  tocSearch.addEventListener('input', () => {
    const q = tocSearch.value.trim().toLowerCase();
    tocLinksForSearch.forEach(l => {
      const match = !q || l.textContent.toLowerCase().includes(q);
      l.classList.toggle('hidden-by-search', !match);
    });
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => highlightMatches(tocSearch.value.trim()), 250);
  });

  // Enter key jumps to the next match; Escape clears the search
  tocSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && lastMarks.length > 1) {
      lastMarks[lastMatchIndex].classList.remove('search-hit-active');
      lastMatchIndex = (lastMatchIndex + 1) % lastMarks.length;
      lastMarks[lastMatchIndex].classList.add('search-hit-active');
      lastMarks[lastMatchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else if (e.key === 'Escape') {
      tocSearch.value = '';
      clearHighlights();
      tocLinksForSearch.forEach(l => l.classList.remove('hidden-by-search'));
    }
  });
} catch (e) { console.error('[page content search] failed:', e); }</script>
